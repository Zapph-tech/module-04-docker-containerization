<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zapph | Cloud Engineer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 2.5rem;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            padding: 10px 20px;
            border-radius: 9999px;
            font-weight: 600;
            margin-top: 20px;
        }
        .dot { width: 10px; height: 10px; background: #34d399; border-radius: 50%; margin-right: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Zapph's Cloud Portfolio</h1>
        <p>Deployed on AWS EC2 (eu-north-1)</p>
        <div class="badge">
            <div class="dot"></div> Database Status: Connected
        </div>
    </div>
</body>
</html>
